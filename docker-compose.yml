services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5434:5432"  # 5434 on the host to avoid clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
